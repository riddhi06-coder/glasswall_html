<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You – Glass Wall Systems</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.png" />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/magnific-popup.css" />
    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/spacing.css" />
    <link rel="stylesheet" href="assets/css/odometer-min.css" />
    <link rel="stylesheet" href="assets/css/font-awesome-pro.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/media.css" />
    <style>
      .ty-wrap { padding-top: 130px; padding-bottom: 130px; }
      .ty-icon {
        width: 104px; height: 104px; border-radius: 50%;
        background: #e8f7f0; display: flex; align-items: center; justify-content: center;
        margin: 0 auto 30px; box-shadow: 0 10px 30px rgba(10,138,95,.18);
      }
      .ty-icon svg { width: 50px; height: 50px; }
      .ty-wrap p { font-size: 16px; line-height: 1.7; color: #5b6472; }
    </style>
  </head>
  <body class="">
    <div id="site-header"></div>

    <div id="smooth-wrapper">
      <div id="smooth-content">
        <main>

          <!-- hero start -->
          <section class="tp-breadcrumb-area tp-bg tp-overlay p-relative" data-background="assets/images/banner/5650.webp">
            <div class="container">
              <div class="tp-breadcrumb pb-50">
                <div class="page-heading">
                  <h1 class="tp-breadcrumb-title tp-text-white margin-0">Thank You</h1>
                </div>
                <div class="tp-breadcrumb-menu tp-flex-center mb-15 pt-35">
                  <span><a href="index.html">Home</a></span>
                  <span class="tp-breadcrumb-dvdr">-</span>
                  <span>Thank You</span>
                </div>
              </div>
            </div>
          </section>
          <!-- hero end -->

          <!-- thank-you body start -->
          <section class="ty-wrap fix">
            <div class="container">
              <div class="row justify-content-center">
                <div class="col-lg-8 text-center">
                  <div class="ty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#0a8a5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="10" stroke="#0a8a5f" stroke-opacity=".25"></circle>
                      <path d="M8 12.5l2.5 2.5L16 9"></path>
                    </svg>
                  </div>
                  <span class="tp-section-sub-title mb-15 tp_fade_anim" data-duration=".9">Submission Received</span>
                  <h2 class="tp-section-title mb-20 tp_fade_anim" data-duration=".9" data-delay=".2" id="tyHeading">Thank You!</h2>
                  <p class="mb-40" id="tyMessage">
                    Your submission has been received successfully. Our team will get back to you shortly.
                    A confirmation email is on its way to your inbox.
                  </p>
                  <div class="tp-about-btn tp_fade_anim d-flex justify-content-center" data-delay=".3">
                    <a href="index.html" class="tp-btn">
                      <span class="tp-btn-text">Back to Home</span>
                      <span class="tp-btn-icon">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <path d="M0.75 10.75L10.75 0.75" stroke="currentcolor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                          <path d="M0.75 0.75H10.75V10.75" stroke="currentcolor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      </span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <!-- thank-you body end -->

        </main>
        <div id="site-footer"></div>
      </div>
    </div>

    <!-- adapt message to the form type (?type=contact | careers) -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var t = params.get('type');
        var role = params.get('role');
        var h = document.getElementById('tyHeading');
        var m = document.getElementById('tyMessage');
        if (t === 'careers') {
          h.textContent = 'Application Received!';
          var forRole = role ? ' for the position of ' + role : '';
          m.textContent = 'Thank you for applying' + forRole + ' at Glass Wall Systems. We have received your application and resume — our HR team will review your profile and reach out if there is a suitable match. A confirmation email has been sent to you.';
        } else if (t === 'contact') {
          h.textContent = 'Thank You for Reaching Out!';
          m.textContent = 'Your message has been received. Our team will get back to you shortly, and a confirmation email is on its way to your inbox.';
        }
      })();
    </script>

    <!-- scripts -->
    <script src="assets/js/include.js"></script>
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/vandor/waypoints.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/swiper-bundle.min.js"></script>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/scrol-smooth.js"></script>
    <script src="assets/js/ScrollToPlugin.min.js"></script>
    <script src="assets/js/ScrollTrigger.min.js"></script>
    <script src="assets/js/splitText.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
